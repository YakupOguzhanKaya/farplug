name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Neither binary links anything beyond libc, so Linux builds are fully static.
  server:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cross --locked
      - run: cross build --release --target ${{ matrix.target }} -p usbridged
      - name: package
        run: |
          d=usbridged-${{ matrix.target }}
          mkdir -p "$d"
          cp target/${{ matrix.target }}/release/usbridged "$d/"
          cp config.example.toml dist/usbridged.service install/install-server.sh README.md "$d/"
          tar czf "$d.tar.gz" "$d"
          sha256sum "$d.tar.gz" > "$d.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: usbridged-${{ matrix.target }}
          path: usbridged-*.tar.gz*

  client-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cross --locked
      - run: cross build --release --target ${{ matrix.target }} -p usbridge
      - name: package
        run: |
          d=usbridge-${{ matrix.target }}
          mkdir -p "$d"
          cp target/${{ matrix.target }}/release/usbridge "$d/"
          cp install/install-client.sh dist/usbridge-agent.service README.md "$d/"
          tar czf "$d.tar.gz" "$d"
          sha256sum "$d.tar.gz" > "$d.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: usbridge-${{ matrix.target }}
          path: usbridge-*.tar.gz*

  # The GUI links GTK for the tray icon, so it is built natively per arch
  # against glibc rather than cross-compiled to musl like the CLI.
  gui-linux:
    strategy:
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, runner: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, runner: ubuntu-22.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p usbridge-gui
      - name: package
        run: |
          d=usbridge-gui-${{ matrix.target }}
          mkdir -p "$d"
          cp target/release/usbridge-gui dist/usbridge.desktop dist/usbridge-tray.desktop "$d/"
          tar czf "$d.tar.gz" "$d"
          sha256sum "$d.tar.gz" > "$d.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: usbridge-gui-${{ matrix.target }}
          path: usbridge-gui-*.tar.gz*

  # Attaching does not work on macOS yet; listing, the agent and the window do.
  client-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: |
          cargo build --release --target aarch64-apple-darwin -p usbridge -p usbridge-gui
          cargo build --release --target x86_64-apple-darwin -p usbridge -p usbridge-gui
      - name: package universal binaries
        run: |
          d=usbridge-universal-apple-darwin
          mkdir -p "$d"
          for b in usbridge usbridge-gui; do
            lipo -create -output "$d/$b" \
              target/aarch64-apple-darwin/release/$b \
              target/x86_64-apple-darwin/release/$b
          done
          cp install/install-client.sh dist/com.usbridge.agent.plist README.md "$d/"
          tar czf "$d.tar.gz" "$d"
          shasum -a 256 "$d.tar.gz" > "$d.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: usbridge-universal-apple-darwin
          path: usbridge-*.tar.gz*

  # Needs the usbip-win2 driver at runtime; install-client.ps1 installs it.
  client-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        target: [x86_64-pc-windows-msvc, aarch64-pc-windows-msvc]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --target ${{ matrix.target }} -p usbridge -p usbridge-gui
      - name: package
        shell: pwsh
        run: |
          $d = "usbridge-${{ matrix.target }}"
          New-Item -ItemType Directory $d | Out-Null
          Copy-Item target/${{ matrix.target }}/release/usbridge.exe, target/${{ matrix.target }}/release/usbridge-gui.exe, README.md, install/install-client.ps1 $d
          Compress-Archive -Path $d -DestinationPath "$d.zip"
          "$((Get-FileHash "$d.zip" -Algorithm SHA256).Hash.ToLower())  $d.zip" | Out-File -Encoding ascii "$d.zip.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: usbridge-${{ matrix.target }}
          path: usbridge-*.zip*

  publish:
    needs: [server, client-linux, gui-linux, client-macos, client-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
