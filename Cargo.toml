[workspace]
resolver = "2"
members = ["crates/usbip", "crates/server", "crates/client", "crates/gui"]

[workspace.package]
version = "0.3.4"
edition = "2021"
rust-version = "1.88"
license = "MIT"

[workspace.dependencies]
farplug-usbip = { path = "crates/usbip" }
farplug = { path = "crates/client" }

anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
ctrlc = { version = "3", features = ["termination"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.2"
socket2 = { version = "0.5", features = ["all"] }
tempfile = "3"
thiserror = "2"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
