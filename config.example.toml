# farplugd configuration.
#
# Each [device.<id>] block exports one USB device. Clients attach by <id>, so
# keep it stable even if the hardware is replaced. Devices not listed here are
# never touched.
#
# Run `sudo farplugd scan` to see what is plugged in and its vid/pid/serial.
# Every matcher you set must match; if several devices match, none is exported.
# Restart farplugd after editing: sudo systemctl restart farplugd

# Dual-stack (IPv4 + IPv6). Use "0.0.0.0:3240" for IPv4-only.
listen = "[::]:3240"

# Also export every device no [device.*] block matches, under a generated id
# (name plus serial, or plus port). Hubs, network adapters and storage are
# never included this way. `farplugd check` shows what it would export.
# export_all = true
# exclude = ["1-1.4", "046d:c548"]   # ports or USB ids to leave alone

# Examples; uncomment and adapt.
#
# [device.zigbee]
# label = "SMLIGHT SLZB-07"
# vid = "10c4"
# pid = "ea60"
# serial = "0001"
#
# [device.zwave]
# label = "Zooz ZST39 800"
# vid = "1a86"
# pid = "55d4"
#
# Identical devices without serial numbers: match the physical port instead.
# [device.ups]
# label = "Eaton 5E"
# port = "1-1.4"
