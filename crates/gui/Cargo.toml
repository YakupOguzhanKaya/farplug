[package]
name = "farplug-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
farplug.workspace = true
farplug-usbip.workspace = true

anyhow.workspace = true
eframe = "0.29"
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[build-dependencies]
winresource = { version = "0.1.31", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
ksni = { version = "0.3.6", default-features = false, features = ["blocking", "async-io"] }

[target.'cfg(windows)'.dependencies]
tray-icon = { version = "0.19", default-features = false }
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }
